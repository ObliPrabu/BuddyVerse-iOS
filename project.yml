name: BuddyVerse
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true

packages:
  FirebaseIOS:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0

targets:
  BuddyVerse:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: BuddyVerse
    resources:
      - path: BuddyVerse/Resources/Assets.xcassets
      - path: BuddyVerse/Resources/GoogleService-Info.plist
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.buddyverse.ios
        INFOPLIST_FILE: BuddyVerse/Resources/Info.plist
        # Kept in sync with Android's versionName (app/build.gradle.kts) -
        # bump both together after a meaningful cross-platform change so the
        # version label shown on the Welcome screen can confirm two test
        # devices are running the same build.
        MARKETING_VERSION: "1.6.6"
        CURRENT_PROJECT_VERSION: "50"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: "PS8DGXJ8S8"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: FirebaseIOS
        product: FirebaseFirestore
      - package: FirebaseIOS
        product: FirebaseAuth
      - target: BuddyVerseWidget
        embed: true
    info:
      path: BuddyVerse/Resources/Info.plist
      properties:
        # xcodegen's own default for these two keys is a hardcoded "1.0"/"1"
        # literal, not the MARKETING_VERSION/CURRENT_PROJECT_VERSION build
        # settings above - spelling them out here as build-variable
        # references is what actually makes CFBundleShortVersionString (and
        # the app's on-screen version label) track a version bump.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        # Required for LiveActivityManager's Activity.request(...) calls to
        # succeed at all (iOS 16.2+ only - see that file) - the "you vs
        # them" Dynamic Island shown while a real multiplayer game is
        # backgrounded.
        NSSupportsLiveActivities: true
        # Lets the BuddyVerseWidget home-screen widget deep-link straight
        # into a game (buddyverse://daily/jokes, buddyverse://daily/riddles)
        # instead of just opening to Welcome - see DeepLinkManager.swift.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - buddyverse
            CFBundleURLName: com.example.buddyverse.ios

  BuddyVerseWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: BuddyVerseWidget
      # BuddyVerseActivityAttributes is the shared "shape" of the Live
      # Activity's data - it has to be compiled into BOTH this extension
      # and the main BuddyVerse target (see that file's own doc comment),
      # so it's listed here individually rather than living under this
      # target's own directory.
      - path: BuddyVerse/Core/BuddyVerseActivityAttributes.swift
      # Same reasoning: DailyContentWidget.swift (under BuddyVerseWidget/
      # above) needs DailyContentPool's joke/riddle data compiled into this
      # extension target too.
      - path: BuddyVerse/Core/DailyContentPool.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.buddyverse.ios.BuddyVerseWidget
        INFOPLIST_FILE: BuddyVerseWidget/Info.plist
        # An app extension's CFBundleVersion must match its containing app's
        # (App Store validation rejects a mismatch) - xcodegen's default of
        # "1" never matched the main BuddyVerse target's real build number,
        # so this was silently wrong before the widget did anything
        # user-facing. Bump this alongside CURRENT_PROJECT_VERSION/
        # MARKETING_VERSION above on every version bump from now on.
        CURRENT_PROJECT_VERSION: "50"
        MARKETING_VERSION: "1.6.6"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: "PS8DGXJ8S8"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
    info:
      path: BuddyVerseWidget/Info.plist
      properties:
        CFBundleDisplayName: BuddyVerseWidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  BuddyVerseUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: BuddyVerseUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.buddyverse.ios.UITests
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: "PS8DGXJ8S8"
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: BuddyVerse
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: BuddyVerse

schemes:
  BuddyVerse:
    build:
      targets:
        BuddyVerse: all
        BuddyVerseUITests: [test]
    test:
      targets:
        - BuddyVerseUITests
    run:
      config: Debug
