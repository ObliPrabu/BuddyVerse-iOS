name: BuddyVerse
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true

packages:
  FirebaseIOS:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0

targets:
  BuddyVerse:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: BuddyVerse
    resources:
      - path: BuddyVerse/Resources/Assets.xcassets
      - path: BuddyVerse/Resources/GoogleService-Info.plist
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.buddyverse.ios
        INFOPLIST_FILE: BuddyVerse/Resources/Info.plist
        # Kept in sync with Android's versionName (app/build.gradle.kts) -
        # bump both together after a meaningful cross-platform change so the
        # version label shown on the Welcome screen can confirm two test
        # devices are running the same build.
        MARKETING_VERSION: "1.4.0"
        CURRENT_PROJECT_VERSION: "25"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: "PS8DGXJ8S8"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: FirebaseIOS
        product: FirebaseFirestore
      - package: FirebaseIOS
        product: FirebaseAuth
    info:
      path: BuddyVerse/Resources/Info.plist
      properties:
        # xcodegen's own default for these two keys is a hardcoded "1.0"/"1"
        # literal, not the MARKETING_VERSION/CURRENT_PROJECT_VERSION build
        # settings above - spelling them out here as build-variable
        # references is what actually makes CFBundleShortVersionString (and
        # the app's on-screen version label) track a version bump.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false

  BuddyVerseUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: BuddyVerseUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.buddyverse.ios.UITests
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: "PS8DGXJ8S8"
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: BuddyVerse
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: BuddyVerse

schemes:
  BuddyVerse:
    build:
      targets:
        BuddyVerse: all
        BuddyVerseUITests: [test]
    test:
      targets:
        - BuddyVerseUITests
    run:
      config: Debug
